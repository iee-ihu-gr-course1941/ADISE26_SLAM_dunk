<!--περιεχει μονο το body και το css της σελιδας χωρις html/head-->
<link rel="stylesheet" href="/css/profile.css" />
<div class="profile-1" id="profile">
  <div class="background-2"></div>
  <img
    src="/css/images/tree-branch-onitama.png"
    class="tree-branch-onitama-3"
    alt="tree-branch-onitama"
  />
  <img
    src="/css/images/temple-with-branches.png"
    class="temple-with-branches-4"
    alt="temple-with-branches"
  />
  <img
    src="/css/images/tree-with-braches.png"
    class="tree-with-braches-5"
    alt="tree-with-braches"
  />
  <img
    src="/css/images/tree-branch-right.png"
    class="tree-branch-right-6"
    alt="tree-branch-right"
  />
  <div class="profile-back-button">
    <a href="/lobbies" id="profile-back-button">Back</a>
  </div>
  <div class="profile-heading-div">
    <h2 class="profile-header">Profile</h2>
  </div>
  <div class="profile-username-div">
    <p class="username-text">
      <span class="text-black" id="profile-username"></span>
    </p>
  </div>
  <div class="player-stats-div">
    <div>
      <h2 class="player-stats-heading">Player statistics</h2>
      <div class="wins-text">
        <span >Wins: <span id="profile-wins"></span></span>
      </div>
      <div class="losses-text">
        <span 
          >Losses: <span id="profile-losses"></span
        ></span>
      </div>
      <div class="draws-text">
        <span >Draws: <span id="profile-draws"></span></span>
      </div>
      
     
    </div>
  </div>
  <div class="win-percentage-div">
    <h4 class="win-percentage-heading">Win percentage</h4>
     <div class="win-percentage-text">
        <span> <span id="profile-win-percentage"></span>0%</span>
      </div>
  </div>
  <div class="elo-div">
    <h4 class="elo-heading">Elo</h4>
     <div class="elo-text">
        <span><span id="profile-elo"></span></span>
      </div>
  </div>
  
  <script src="../src/js/profile.js"></script>
</div>
