<link rel="stylesheet" href="/css/hud.css" />
<link rel="stylesheet" href="/css/game.css" />
<div id="root-window">
  <div id="utility-hud">
    <button id="leave-lobby-button">Leave Game</button>
    <button id="start-game-button">Start Game</button>
  </div>
  <div id="main-hud" class="overlay">
    <div id="game-info" class="game-info">
      <div id="game-settings" class="game-settings">
        <div id="game-mode" class="game-mode">PvP</div>
        <div id="game-status" class="game-status">in progress</div>
        <div id="game-winner" class="game-winner">sotiatha</div>
      </div>
      <div id="currently-playing" class="currently-playing">
        <span id="currently-playing-text" class="currently-playing-text">Playing: sotiatha</span>
        <div id="currently-playing-orb" class="currently-playing-orb"></div>
      </div>
      <div id="in-lobby" class="in-lobby">
        <div id="scoreboard">
          <div id="lobby-heading">Lobby:</div>
          <div id="players-container" class="players-container">
              <div id="playerblue-section" class="blue-player-info">
                <div id="playerblue-color" class="banner-color-blue"></div>
                <div class="player-details">
                  <div id="playerblue-username" class="playerblue-username">sotiatha</div>
                </div>
              </div>
              <div id="playerred-section" class="red-player-info">
                <div id="playerred-color" class="banner-color-red"></div>
                <div class="player-details">
                  <div id="playerred-username" class="playerred-username">alexkara</div>
                </div>
              </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <canvas class="render"></canvas>
</div>
