<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onitama</title>
    <link
      href="https://fonts.googleapis.com/css?family=Inter&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--ο router φορτωνει εδω την καθε σελιδα απο τον φακελο pages-->
    <div id="main-page" style="width: 1920px; height: 1080px"></div>
    <!--to link gia na exoume prosvasi sthn jquery pou einai mesa sto src/jquery folder-->
    <script src="src/jquery-4.1.0/jquery-4.10-min.js"></script>
    <!--το fit.js πρεπει να φορτωνει πριν τον router για την σωστη αναπροσαρμογη των σελιδων-->
    <script src="/src/js/fit.js"></script>
    <script src="/src/js/router.js"></script>
    <script type="module" src="/src/js/login.js"></script>
    <!--το leaderboard.js που φερνει τους παικτες απο το backend-->
    <script type="module" src="/src/js/leaderboard.js"></script>
    <!--to profile.js pou fernei ta stoixeia tou paikth apo to backend-->
    <script type="module" src="/src/js/profile.js"></script>
    <!--to lobbies.js pou fernei ta lobbies sto frontend-->
    <script type="module" src="/src/js/lobbies.js"></script>
    <!--to game.js pou kanei load, rendern kai logikh tou frontend gia ta grafika tou game-->
    <script type="module" src="/src/js/game.js"></script>
    <!--το menu.js που συνδεει τα κουμπια του main menu και κανει το logout-->
    <script type="module" src="/src/js/menu.js"></script>
  </body>
</html>
