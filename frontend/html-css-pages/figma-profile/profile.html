<!doctype html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Onitama ΑΔΙΣΕ 2027</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage" aria-label="Προφίλ παίκτη">
    <img class="deco at" style="--x:8;--y:41;--w:245;--h:184;--rot:-21;opacity:.7"   src="images/tree.png"        alt="" />
    <img class="deco at" style="--x:271;--y:260;--w:215;--h:161;--rot:50;opacity:.7" src="images/tree-branch.png" alt="" />
    <img class="deco at" style="--x:0;--y:0;--w:140;--h:250;opacity:.6"              src="images/temple.png"      alt="" />
    <img class="deco at" style="--x:266;--y:0;--w:294;--h:221;--rot:1;opacity:.5"    src="images/pine.png"        alt="" />

    <h1 class="at text" style="--x:222;--y:3">Profile</h1>
    <p class="at text player-name" style="--x:152;--y:18">Sotos</p>

    <section class="at panel stats" style="--x:152;--y:43;--w:202;--h:99" aria-label="Στατιστικά παίκτη">
      <h2>Player statistics</h2>
      <dl>
        <div><dt>Wins:</dt> <dd></dd></div>
        <div><dt>Losses:</dt> <dd></dd></div>
        <div><dt>Win percentage:</dt> <dd>X%</dd></div>
      </dl>
    </section>
  </main>
</body>
</html>
