<!doctype html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard — Onitama ΑΔΙΣΕ 2027</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage" aria-label="Κατάταξη">
    <img class="deco at" style="--x:8;--y:41;--w:245;--h:184;--rot:-21;opacity:.7"   src="images/tree.png"        alt="" />
    <img class="deco at" style="--x:271;--y:260;--w:215;--h:161;--rot:50;opacity:.7" src="images/tree-branch.png" alt="" />
    <img class="deco at" style="--x:0;--y:0;--w:140;--h:250;opacity:.6"              src="images/temple.png"      alt="" />
    <img class="deco at" style="--x:266;--y:0;--w:294;--h:221;--rot:1;opacity:.5"    src="images/pine.png"        alt="" />

    <h1 class="at text" style="--x:208;--y:6">Leaderboard</h1>
    <ol class="at board" style="--x:117;--y:29;--w:272;--h:182">
      <li><span class="name">Sotos</span><span class="wins">Wins: 1000000</span></li>
      <li></li><li></li><li></li><li></li><li></li><li></li>
      <li></li><li></li><li></li><li></li><li></li><li></li>
    </ol>

    <nav class="at pager" style="--x:349;--y:218;--w:40;--h:17" aria-label="Σελίδες">
      <button type="button" aria-label="Προηγούμενη σελίδα">&lt;</button>
      <button type="button" aria-label="Επόμενη σελίδα">&gt;</button>
    </nav>
  </main>
</body>
</html>
